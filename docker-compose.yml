# Local development: Postgres 16 only. Run the app on the host with `pnpm dev`.
# The production services (web, worker, caddy) are added as a profile in task 6.2.
name: crewshift

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-crewshift}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-crewshift}
      POSTGRES_DB: ${POSTGRES_DB:-crewshift}
      TZ: UTC
      PGTZ: UTC
    ports:
      # Bound to localhost only, so the dev database is not exposed on the network.
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
