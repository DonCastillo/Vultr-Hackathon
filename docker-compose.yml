# CrewShift services.
#
# Local development (default, no profile): Postgres 16 only; run the app on the host with `pnpm dev`.
#   docker compose up -d --wait postgres
#
# Production on the Vultr VM (task 6.2): the "prod" profile adds web, worker, a one-shot
# migrate job and Caddy (HTTPS on <ip>.sslip.io with a Let's Encrypt certificate).
#   docker compose --profile prod up -d --build
#   docker compose --profile prod run --rm migrate prisma db seed     # load the demo data
#
# web and worker read API keys from .env. DATABASE_URL is overridden so they reach the
# postgres service by name; keep POSTGRES_PASSWORD URL-safe (letters and digits).
name: crewshift

x-app: &app
  env_file: .env
  environment:
    DATABASE_URL: postgresql://${POSTGRES_USER:-crewshift}:${POSTGRES_PASSWORD:-crewshift}@postgres:5432/${POSTGRES_DB:-crewshift}
    TZ: UTC

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-crewshift}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-crewshift}
      POSTGRES_DB: ${POSTGRES_DB:-crewshift}
      TZ: UTC
      PGTZ: UTC
    ports:
      # Bound to localhost only, so the database is never exposed on the network.
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  # One-shot job: applies pending migrations, then exits. web and worker wait for it.
  # Also the way to run the seed (see the top of this file).
  migrate:
    <<: *app
    profiles: ["prod"]
    build: { context: ., target: worker }
    image: crewshift-worker
    command: ["prisma", "migrate", "deploy"]
    restart: "no"
    depends_on:
      postgres: { condition: service_healthy }

  web:
    <<: *app
    profiles: ["prod"]
    build: { context: ., target: web }
    image: crewshift-web
    restart: unless-stopped
    expose: ["3000"]
    depends_on:
      migrate: { condition: service_completed_successfully }

  # Background loop: every 5s, expires unanswered offers and texts the next candidate.
  worker:
    <<: *app
    profiles: ["prod"]
    build: { context: ., target: worker }
    image: crewshift-worker
    restart: unless-stopped
    depends_on:
      migrate: { condition: service_completed_successfully }

  caddy:
    profiles: ["prod"]
    image: caddy:2.10-alpine
    restart: unless-stopped
    environment:
      # <vm-ip>.sslip.io serves HTTPS with an automatic certificate; http://localhost is plain HTTP.
      SITE_ADDRESS: ${SITE_ADDRESS:-http://localhost}
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
      - "${HTTPS_PORT:-443}:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on: [web]

volumes:
  pgdata:
  caddy_data:
  caddy_config:
